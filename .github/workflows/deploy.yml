name: Deploy

# Tags only. The master -> staging path lives in master.yml.
on:
  push:
    tags:
      - "dev**"
      - "staging**"
      - "prod**"

permissions:
  contents: read

jobs:
  resolve-environment:
    name: Resolve Environment
    runs-on: bratislava
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
    steps:
      - name: Map tag to environment
        id: resolve
        uses: bratislava/github-actions/.github/actions/resolve-environment@v3.0.0

  # _build reuses an existing commit image (re-tagging it for the cluster) or
  # builds and pushes when it is missing.
  build:
    name: Build
    needs: resolve-environment
    uses: ./.github/workflows/_build.yml
    secrets: inherit
    with:
      push: true
      cluster: ${{ needs.resolve-environment.outputs.environment }}

  trigger-deploy:
    name: Trigger Infrastructure Deploy (${{ needs.resolve-environment.outputs.environment }})
    needs: [resolve-environment, build]
    uses: bratislava/github-actions/.github/workflows/trigger-infra-deploy.yml@v3.0.0
    secrets: inherit
    with:
      cluster: ${{ needs.resolve-environment.outputs.environment }}
      app: kupaliska_starz/backend
      dispatch_ref: mpinter/kupaliska-starz-apps
